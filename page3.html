  <div class="container">
        <div class="row justify-content-center">
        <div class="col-md-12">
            <div class="card">
            <form>
                <h5 class="fw-bold mb-3">Student Information</h5>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" placeholder="Type here...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" placeholder="Type here...">
                    </div>
                </div>

                <div class="row mb-4">
                  <div class="col-md-4">
    <label class="form-label">Birth Date</label>
    <input type="text" class="form-control" placeholder="Month/Date/Year">
</div>
                    <div class="col-md-4">
                        <label class="form-label">Gender</label>
                        <select class="form-select">
                            
                            <option selected>Select here...</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                       <label class="form-label">Grade Level</label>
                        <select class="form-select">
                       <option selected>Select here...</option>
                            <option>Casa</option>
                            <option>Grade 1</option>
                            <option>Grade 2</option>
                            <option>Grade 3</option>
                            <option>Grade 4</option>
                            <option>Grade 5</option>
                            <option>Grade 6</option>
                            <option>Grade 7</option>
                            <option>Grade 8</option>
                            <option>Grade 9</option>
                            <option>Grade 10</option>
                            <option>Grade 11</option>
                            <option>Grade 12</option>
                            </select>
                    </div>
                </div>


<h5 class="fw-bold mb-3">Contact Details</h5>

<div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" class="form-control" placeholder="student@example.com">
</div>

<div class="mb-4">
    <label class="form-label">Contact Number</label>
    <input type="tel" class="form-control" placeholder="0123-456-789">
</div>

<h5 class="fw-bold mb-3">Other Information</h5>

<div class="mb-3">
    <label class="form-label d-block">Mode of Learning</label>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="learningMode" id="online">
        <label class="form-check-label" for="online">Online</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="learningMode" id="f2f">
        <label class="form-check-label" for="f2f">Face-to-Face</label>
    </div>
</div>
<br>
<div class="form-check mb-4">
    <input class="form-check-input" type="checkbox" id="confirmCheck">
    <label class="form-check-label" for="confirmCheck">
        I confirm that the information provided is true and complete.
    </label>
</div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Submit Enrollment</button>
                </div>
            </form>
       
        </div>
    </div>
</div>
