<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <div class="container">
<div class="row justify-content-center">
    <div class="col-lg-7">
        <br>
        <h1>Contact Us</h1>
        <form>
        <label for="fullname" class="form-label">Full Name</label>
        <br>
        <input type="text" class="form-control">
        <br>
        <label for="emailaddress" class="form-label">Email Address</label>
        <br>
        <input type="email" class="form-control">
        <br>
        <label for="subject" class="form-label">Subject</label>
        <br>
        <input type="text" class="form-control">
        <br>
        <label for="message" class="form-label">Message</label>
        <br>
        <textarea id="message" class="form-control" placeholder="Type your message here" rows="8"></textarea>

<br>
<button type="button" class="btn btn-primary rounded-3 mb-5">Send message</button>
</form>
    </div>
    </div>
    </div>
    
    <br><br>
    <div class="row"></div>
    <h1>School Office Hours</h1>
    <br>
     <div class="row justify-content-center">
            <div class="col-lg-12" id="table1">
                <center>
                <table class="table-hover table-bordered align-middle text-center w-50">
                    <thead>
                        <tr class="display-8">
                            <th scope="col" style="width: 30%;">DAY</th>
                            <th scope="col" style="width: 40%;">OFFICE HOURS</th>
                            <th scope="col" style="width: 30%;">DEPARTMENT</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="display-8" id="row2" >
                            <td>Monday</td>
                            <td>8:00 AM - 4:00 PM</td>
                            <td>Registrar's Office</td>
                        </tr>

                        <tr class="display-8" id="row3">
                            <td>Tuesday</td>
                            <td>8:00 AM - 4:00 PM</td>
                            <td>Accounting Office</td>
                        </tr>
                        <tr class="display-8" id="row4">
                            <td>Wednesday</td>
                            <td>8:00 AM - 4:00 PM</td>
                            <td>Guidance Office</td>
                        </tr>
                        <tr class="display-8" id="row5">
                            <td>Thursday</td>
                            <td>8:00 AM - 4:00 PM</td>
                            <td>Principal's Office</td>
                        </tr>
                        <tr class="display-8" id="row6">
                            <td>Friday</td></td>
                            <td>8:00 AM - 3:00 PM</td>
                            <td>Admin Office</td>
                        </tr>
                    </tbody>
                </table>
                </center>
                
                <br>
</body>
</html>
